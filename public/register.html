<!DOCTYPE html>
<html ng-app="OpenDevHubApp">
    <head>
        <meta charset="UTF-8">
        <title>Create Account</title>

        <link rel="stylesheet" href="css/styles.css">

        <!--AngularJS-->
        <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

        <!--Angular application-->
        <script src="js/app.js"></script>

        <!--Register controller-->
        <script src="js/registerController.js"></script>
    </head>

    <body ng-controller="RegisterController">
        <!--Navigation bar-->
        <nav class="navbar">
            <h2>OpenDevHub</h2>
            <div>
                <a href="index.html">Home</a>
                <a href="projects.html">Projects</a>
                <a href="login.html">Login</a>
            </div>
        </nav>

        <header>
            <h1>Create Account</h1>
            <p>Join OpenDevHub and start building your developer portfolio.</p>
        </header>

        <main class="container">
            <!--Registration input fields-->
            <div class="dashboard-card">
                <label>Name:</label>
                <input type="text" ng-model="user.name" placeholder="Full Name">

                <label>Email:</label>
                <input type="email" ng-model="user.email" placeholder="Email">

                <label>Username:</label>
                <input type="text" ng-model="user.username" placeholder="Username">

                <label>Password:</label>
                <input type="password" ng-model="user.password" placeholder="Password">

                <br><br>

                <!--Register anf go to login buttons-->
                <button class="primary-btn" ng-click="register()">Create Account</button>
                <button class="secondary-btn" ng-click="goToLogin()">Back to Login</button>

                <p class="status-message">{{status}}</p>
            </div>
        </main>
    </body>
</html>
