<!DOCTYPE html>
<html ng-app="OpenDevHubApp">
    <head>
        <meta charset="UTF-8">
        <title>Create Project</title>

        <link rel="stylesheet" href="css/styles.css">

        <!--AngularJS-->
        <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

        <!--Angular application-->
        <script src="js/app.js"></script>

        <!--createProject controller-->
        <script src="js/createProjectController.js"></script>
    </head>

    <body ng-controller="CreateProjectController">
        <!--Navigation bar-->
        <nav class="navbar">
            <h2>OpenDevHub</h2>
            <div>
                <a href="index.html">Home</a>
                <a href="projects.html">Projects</a>
                <a href="dashboard.html">Dashboard</a>
                <a href="login.html">Login</a>
            </div>
        </nav>

        <header>
            <h1>Create New Project</h1>
            <p>Add a project to your portfolio.</p>
        </header>

        <main class="container">
            <!--New project input fields-->
            <div class="dashboard-card">
                <label>Project Title:</label>
                <input type="text" ng-model="project.title">

                <label>Description:</label>
                <textarea rows="5" ng-model="project.description"></textarea>

                <label>Status:</label>
                <select ng-model="project.status">
                    <option>Open</option>
                    <option>Closed</option>
                    <option>Completed</option>
                </select>

                <label>Visibility:</label>
                <select ng-model="project.visibility">
                    <option>Public</option>
                    <option>Private</option>
                </select>

                <label>Technologies:</label>
                <input type="text" ng-model="technologies" placeholder="AngularJS, Python, etc.">

                <br><br>

                <!--Create project and cancel buttons-->
                <button class="primary-btn" ng-click="createProject()">Create Project</button>
                <button class="secondary-btn" ng-click="cancel()">Cancel</button>

                <p class="status-message">{{status}}</p>
            </div>
        </main>
    </body>
</html>
