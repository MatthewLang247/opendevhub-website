<!DOCTYPE html>
<html ng-app="OpenDevHubApp">
    <head>
        <meta charset="UTF-8">
        <title>OpenDevHub Login</title>

        <link rel="stylesheet" href="css/styles.css">

        <!--AngularJS-->
        <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

        <!--Angular application-->
        <script src="js/app.js"></script>

        <!--Login controller-->
        <script src="js/loginController.js"></script>
    </head>

    <body ng-controller="LoginController">
        <!--Navigation bar-->
        <nav class="navbar">
            <h2>OpenDevHub</h2>
            <div>
                <a href="index.html">Home</a>
                <a href="projects.html">Projects</a>
                <a href="login.html" class="active">Login</a>
            </div>
        </nav>

        <header>
            <h1>OpenDevHub</h1>

            <p>Open Source Developer Portfolio Platform</p>
        </header>
        
        <main class="container">
            <!--Login input fields-->
            <div class="login-card">
                <h2>Sign In</h2>

                <p class="subtitle">
                    Login to manage your projects and developer portfolio.
                </p>

                <label>Username:</label>
                <input type="text" ng-model="username" placeholder="Enter your username">

                <label>Password:</label>
                <input type="password" ng-model="password" placeholder="Enter your password">

                <!--Login and register buttons-->
                <div class="button-group">
                    <button class="primary-btn" ng-click="login()">Login</button>

                    <button class="secondary-btn" ng-click="register()">Create Account</button>
                </div>

                <p class="status-message">{{status}}</p>

            </div>
        </main>
    </body>
</html>
