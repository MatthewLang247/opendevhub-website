<!DOCTYPE html>
<html ng-app="OpenDevHubApp">
    <head>
        <meta charset="UTF-8">
        <title>Edit Profile</title>
        <link rel="stylesheet" href="css/styles.css">

        <!--AngularJS-->
        <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

        <!--Angular application-->
        <script src="js/app.js"></script>

        <!--Index controller-->
        <script src="js/editProfileController.js"></script>
    </head>

    <body ng-controller="EditProfileController">
        <!--Navigation bar-->
        <nav class="navbar">
            <h2>OpenDevHub</h2>
            <div>
                <a href="index.html">Home</a>
                <a href="projects.html">Projects</a>
                <a href="dashboard.html">Dashboard</a>
                <a href="login.html">Login</a>
            </div>
        </nav>

        <header>
            <h1>Edit Profile</h1>

            <p>Update your portfolio information.</p>
        </header>

        <main class="container">
            <!--Edit profile input fields-->
            <div class="dashboard-card">
                <label>Name:</label>
                <input type="text" ng-model="user.name">

                <label>Email:</label>
                <input type="email" ng-model="user.email">

                <label>Current Position:</label>
                <input type="text" ng-model="user.title">

                <label>Biography:</label>
                <textarea rows="6" ng-model="user.bio"></textarea>

                <label>Skills:</label>
                <input type="text" ng-model="skills" placeholder="Java, C++, MongoDB">

                <br><br>

                <!--Save profile and cancel buttons-->
                <button class="primary-btn" ng-click="saveProfile()">Save Profile</button>
                <button class="secondary-btn" ng-click="cancel()">Cancel</button>

                <p class="status-message">{{status}}</p>
            </div>
        </main>
    </body>
</html>
